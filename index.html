<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#1c2725;font-family:Arial,Helvetica,sans-serif}main{max-width:1600px;margin:auto;padding:20px 32px}header{align-items:center;display:flex;justify-content:space-between;max-width:960px}.eyebrow{color:#42736b;font-size:.65rem;font-weight:800;letter-spacing:.12em;margin:0;text-transform:uppercase}h1{font:400 clamp(2rem,4vw,3.4rem)/.95 Georgia,serif;letter-spacing:-.05em;margin:5px 0}.summary{background:#dcff63;border:1px solid #1c2725;border-radius:10px;min-width:120px;padding:8px 12px}.summary span,.summary small{display:block;font-size:.67rem}.summary strong{display:block;font:1.55rem Georgia,serif;margin:2px 0}.legend{border-bottom:1px solid #d7dcd3;color:#68736e;font-size:.76rem;margin:16px 0 10px;padding-bottom:9px}.filters{align-items:center;display:flex;flex-wrap:wrap;gap:12px;margin-bottom:15px}.filters label{color:#68736e;font-size:.74rem}.filters input{vertical-align:middle;width:85px}.filters b{color:#1c2725}.filters select,.filters button{background:#fffefa;border:1px solid #d7dcd3;border-radius:5px;color:#33413d;font-size:.74rem;padding:5px}.board{align-items:start;display:flex;gap:14px;overflow-x:auto;padding-bottom:25px}.column{background:#e8ebe5;border:1px solid #d0d6cd;border-radius:15px;flex:0 0 315px;min-height:400px;padding:13px}.head{align-items:center;display:flex;justify-content:space-between}.head input{background:transparent;border:0;font:1.25rem Georgia,serif;min-width:0;outline:0;width:210px}.head button,.add{background:transparent;border:0;color:#557269;cursor:pointer}.count{color:#68736e;font-size:.75rem;margin:5px 4px 14px}.cards{display:grid;gap:9px}.card{background:#fffefa;border:1px solid #d8dcd5;border-radius:10px;padding:12px}.card.running{border:2px solid #f66b47;box-shadow:0 0 0 3px #f66b4726}.card.completed{opacity:.5}.top{align-items:flex-start;display:flex;gap:8px}.complete{background:transparent;border:1px solid #a8b0a8;border-radius:50%;height:21px;width:21px}.task-title{background:transparent;border:0;border-bottom:1px solid transparent;color:#1c2725;font-size:.98rem;font-weight:700;line-height:1.25;margin:0 0 9px;min-width:0;outline:0;padding:1px 0;width:100%}.task-title:focus{border-bottom-color:#668d84}.sliders{display:grid;gap:5px;grid-template-columns:1fr 1fr}.sliders label,.more label{color:#68736e;font-size:.68rem}.sliders b{color:#1c2725;float:right}.sliders input{display:block;margin-top:3px;width:100%}.sliders input:disabled{cursor:not-allowed;opacity:.5}.date-row{align-items:center;display:flex;gap:10px;justify-content:space-between;margin-top:9px}.date-row input[type=date]{background:#f5f6f1;border:1px solid #d7dcd3;border-radius:4px;color:#33413d;font-size:.72rem;padding:4px;width:132px}.date-row label{color:#68736e;font-size:.7rem}.date-row input[type=checkbox]{vertical-align:middle}.date-row.overdue input[type=date]{border-color:#f66b47;color:#b74327}.date-row.today input[type=date]{background:#fff1c8;border-color:#d89d1e}.time{align-items:center;color:#68736e;display:flex;font-size:.72rem;gap:6px;justify-content:space-between;margin:10px 0}.time input{background:transparent;border:0;border-bottom:1px solid #d7dcd3;width:42px;text-align:right}.timer{background:#1c2725;border:0;border-radius:5px;color:#fff;cursor:pointer;font-size:.73rem;padding:6px 9px}.timer.pause{background:#f66b47}.more{display:grid;gap:8px;margin-top:10px}.more[hidden]{display:none}.more input,.more textarea{background:#f5f6f1;border:1px solid #d7dcd3;border-radius:4px;display:block;font-size:.73rem;margin-top:3px;padding:4px;width:100%}.more textarea{min-height:48px;resize:vertical}.add{font-size:.8rem;margin:12px 3px 2px;padding:4px}.newcol{align-items:center;background:transparent;border:1px dashed #aeb8ae;border-radius:12px;color:#557269;display:flex;flex:0 0 130px;flex-direction:column;font-size:1.4rem;gap:8px;justify-content:center;min-height:110px}.newcol span{font-size:.78rem}@media(max-width:700px){main{padding:17px 16px}header{display:block}.summary{margin-top:9px;width:120px}.column{flex-basis:290px}}
.sliders{gap:8px}.sliders label{align-items:center;display:flex;gap:5px;white-space:nowrap}.sliders b{float:none;order:3}.sliders input{flex:1;margin:0;min-width:0;order:2;width:auto}
main{max-width:none}.column{flex:0 0 22vw;min-width:250px}.sliders{gap:6px}.sliders label{gap:3px}.sliders input{height:12px}.sliders b{font-size:.66rem}
.card{padding:8px}.task-title{height:24px;margin-bottom:4px;overflow:hidden;resize:none;white-space:nowrap}.task-title:focus{height:48px;overflow:auto;white-space:normal}.priority-strip{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin:2px 0 7px}.priority-control{align-items:center;color:#68736e;display:flex;font-size:.67rem;gap:5px}.priority-control>span:first-child{font-weight:700}.priority-control b{color:#1c2725;font-size:.67rem}.segments{display:grid;flex:1;gap:2px;grid-template-columns:repeat(4,1fr)}.segments button{background:#d7dcd3;border:0;border-radius:3px;cursor:pointer;height:7px;min-width:0;padding:0}.segments button.on{background:#176bc0}.segments button:disabled{cursor:not-allowed;opacity:.55}.compact-meta{align-items:center;display:flex;gap:5px;justify-content:space-between}.date-chip,.weekly-chip,.metric{align-items:center;background:#f5f6f1;border:1px solid #d7dcd3;border-radius:4px;color:#55615d;display:flex;font-size:.66rem;height:27px;position:relative}.date-chip{cursor:pointer;min-width:58px;padding:0 5px}.date-chip input{cursor:pointer;height:100%;inset:0;opacity:0;position:absolute;width:100%}.date-chip.overdue{border-color:#f66b47;color:#b74327}.date-chip.today{background:#fff1c8;border-color:#d89d1e}.weekly-chip{cursor:pointer;justify-content:center;width:27px}.weekly-chip input{height:1px;opacity:0;position:absolute;width:1px}.weekly-chip.active{background:#dfeeea;border-color:#668d84;color:#245f55}.metric{gap:2px;padding:0 4px}.metric span{font-weight:700}.metric input{background:transparent;border:0;border-bottom:1px solid #cbd1ca;font-size:.69rem;padding:1px;text-align:right;width:28px}.metric small{font-size:.6rem}.compact-meta .timer{height:27px;padding:4px 7px}.more{margin-top:7px}
.metric input{width:38px}
main{padding-top:10px}header{border-bottom:1px solid #d7dcd3;display:grid;gap:18px;grid-template-columns:auto minmax(0,1fr) auto;max-width:none;padding-bottom:8px}.eyebrow{font-size:.68rem;margin:0;white-space:nowrap}.header-note{color:#68736e;font-size:.68rem;line-height:1.25;text-align:right}.summary{align-items:baseline;display:flex;gap:5px;min-width:0;padding:4px 8px;white-space:nowrap}.summary span{display:inline;font-size:.67rem}.summary strong{display:inline;font:700 .92rem Arial,Helvetica,sans-serif;margin:0}.filters{margin-top:10px}@media(max-width:800px){header{grid-template-columns:1fr auto}.header-note{grid-column:1/-1;grid-row:2;text-align:left}}
.status-button{background:#edf1eb;border:1px solid #cbd2c9;border-radius:4px;color:#52615c;cursor:pointer;flex:0 0 auto;font-size:.58rem;height:21px;padding:2px 5px}.status-button.waiting{background:#fff1c8;border-color:#d89d1e;color:#7b5811}.status-button.blocked{background:#ffe0d8;border-color:#f66b47;color:#9a341f}.card.waiting{border-style:dashed}.card.blocked{background:#fff8f5;border-color:#ef9b87}.card.waiting:not(.running),.card.blocked:not(.running){opacity:.72}
.card.tier-core{background:#d9e7f5;border-color:#557fa9;box-shadow:inset 4px 0 0 #315f8d}.card.tier-second{background:#eef4fa;border-color:#a9bfd5;box-shadow:inset 4px 0 0 #88a7c5}.filters::before,.filters::after{border-radius:999px;font-size:.66rem;font-weight:700;order:10;padding:4px 8px}.filters::before{background:#d9e7f5;border:1px solid #557fa9;color:#244c74;content:"Core"}.filters::after{background:#eef4fa;border:1px solid #a9bfd5;color:#4f6f90;content:"Second tier"}
.head-actions{display:flex;gap:1px}.head-actions button{height:24px;min-width:24px}.head-actions .delete-cat{color:#9a341f;font-size:1rem;line-height:1}
.date-row.overdue input[type=date],.date-chip.overdue{background:#991b1f;border-color:#6f1115;color:#fff;font-weight:800;box-shadow:0 0 0 2px #991b1f33}
</style>
</head>
<body>
<main>
<header><p class="eyebrow">Priority Board</p><div class="header-note">Urgency: 1 low · 2 ≤3 days · 3 tomorrow · 4 today/overdue · dates use your browser time zone</div><div class="summary"><span>Tracked</span><strong id="tracked">0m</strong></div></header>
<section class="filters" id="filters"></section>
<section class="board" id="board"></section>
</main>
<script>
let state={categories:[],tasks:[]},dragged=null,running=null,now=Date.now(),showCompleted=false,showNotes=false,minUrgency=1,minImportance=1,sortBy='urgency',saveChain=Promise.resolve(),saveErrorShown=false;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function dur(s){let m=Math.floor(s/60);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'}
function task(id){return state.tasks.find(t=>t.id===id)}
function today(){let d=new Date(),local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,10)}
function dayNumber(value){return Date.parse(value+'T12:00:00+04:00')/86400000}
function dateUrgency(value){if(!value)return null;let days=Math.round(dayNumber(value)-dayNumber(today()));return days<=0?4:days===1?3:days<=3?2:1}
function urgency(t){return t.dueDate?dateUrgency(t.dueDate):t.urgency}
function event(type,t,details={}){return {type,taskId:t?.id??null,taskTitle:t?.title??null,categoryId:t?.categoryId??null,dueDate:t?.dueDate??null,...details}}
function save(events=[],metadata={}){let snapshot=JSON.stringify({board:state,events,...metadata});saveChain=saveChain.then(()=>fetch('/api/board',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot,keepalive:true}).then(r=>{if(!r.ok)throw new Error('Save failed')})).catch(()=>{if(!saveErrorShown){saveErrorShown=true;alert('Could not save the board JSON.')}})}
function total(t){return t.actualSeconds+(running&&running.id===t.id?Math.floor((now-running.since)/1000):0)}
function order(a,b){let rank={active:0,waiting:1,blocked:2},statusDiff=rank[a.status||'active']-rank[b.status||'active'];if(statusDiff)return statusDiff;let au=urgency(a),bu=urgency(b);return sortBy==='urgency'?(bu-au)||(b.importance-a.importance):sortBy==='importance'?b.importance-a.importance:(bu+b.importance)-(au+a.importance)}
async function boot(){state=await fetch('/api/board').then(r=>r.json());let changed=false;state.tasks.forEach(t=>{t.actualSeconds=t.actualSeconds||0;if(t.dueDate&&t.urgency!==dateUrgency(t.dueDate)){t.urgency=dateUrgency(t.dueDate);changed=true}});let active=state.tasks.find(t=>t.runningSince&&!t.completed);if(active)running={id:active.id,since:Date.parse(active.runningSince)};if(changed)save();render()}
function render(){state.tasks.forEach(t=>{if(t.dueDate)t.urgency=dateUrgency(t.dueDate)});tracked.textContent=dur(state.tasks.reduce((s,t)=>s+total(t),0));filters.innerHTML=`<label>Min urgency <input type="range" min="1" max="4" value="${minUrgency}" oninput="minUrgency=+this.value;render()"><b>${minUrgency}</b></label><label>Min importance <input type="range" min="1" max="4" value="${minImportance}" oninput="minImportance=+this.value;render()"><b>${minImportance}</b></label><label>Order <select onchange="sortBy=this.value;render()"><option value="priority" ${sortBy==='priority'?'selected':''}>combined priority</option><option value="urgency" ${sortBy==='urgency'?'selected':''}>urgency</option><option value="importance" ${sortBy==='importance'?'selected':''}>importance</option></select></label><button onclick="showCompleted=!showCompleted;render()">${showCompleted?'Hide':'Show'} completed</button><button onclick="showNotes=!showNotes;render()">${showNotes?'Hide':'Show'} tags & notes</button>`;board.innerHTML=state.categories.map(c=>{let ts=state.tasks.filter(t=>t.categoryId===c.id&&(showCompleted||!t.completed)&&urgency(t)>=minUrgency&&t.importance>=minImportance).sort(order);return `<article class="column" ondragover="event.preventDefault()" ondrop="dropTask('${c.id}')"><div class="head"><input value="${esc(c.name)}" oninput="renameCat('${c.id}',this.value)"><span class="head-actions"><button aria-label="Move category left" title="Move category left" onclick="moveCat('${c.id}',-1)">←</button><button aria-label="Move category right" title="Move category right" onclick="moveCat('${c.id}',1)">→</button><button class="delete-cat" aria-label="Delete category" title="Delete empty category" onclick="deleteCategory('${c.id}')">&times;</button></span></div><p class="count">${ts.length} shown · ${state.tasks.filter(t=>t.categoryId===c.id&&!t.completed).length} active</p><div class="cards">${ts.map(card).join('')}</div><button class="add" onclick="newTask('${c.id}')">+ Add task</button></article>`}).join('')+`<button class="newcol" onclick="addCat()">+<span>New category</span></button>`}
function card(t){let r=running&&running.id===t.id,u=urgency(t),distance=t.dueDate?dayNumber(t.dueDate)-dayNumber(today()):null,dateClass=distance<0?'overdue':distance===0?'today':'';return `<div class="card ${r?'running':''} ${t.completed?'completed':''}" data-task-id="${t.id}" draggable="true" ondragstart="dragged='${t.id}'"><div class="top"><button class="complete" onclick="completeTask('${t.id}')">${t.completed?'↺':'✓'}</button><input class="task-title" aria-label="Task name" value="${esc(t.title)}" oninput="renameTask('${t.id}',this.value)"></div><div class="sliders"><label>Urgency <b>${u}</b><input type="range" min="1" max="4" value="${u}" ${t.dueDate?'disabled title="Automatic from due date"':''} onchange="changeUrgency('${t.id}',+this.value)"></label><label>Importance <b>${t.importance}</b><input type="range" min="1" max="4" value="${t.importance}" onchange="changeImportance('${t.id}',+this.value)"></label></div><div class="date-row ${dateClass}"><input aria-label="Due date" type="date" value="${t.dueDate||''}" onchange="changeDate('${t.id}',this.value)"><label><input type="checkbox" ${t.recurrence==='weekly'?'checked':''} onchange="toggleWeekly('${t.id}',this.checked)"> weekly</label></div><div class="time"><label>Estimate <input type="number" min="0" value="${t.estimateMinutes}" onchange="changeEstimate('${t.id}',+this.value)"> min</label><span class="actual">Actual ${dur(total(t))}</span><button class="timer ${r?'pause':''}" onclick="toggleTimer('${t.id}')">${r?'Ⅱ Pause':'▶ Play'}</button></div><div class="more" ${showNotes?'':'hidden'}><label>Tags<input value="${esc(t.tags.join(', '))}" onchange="patch('${t.id}','tags',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></label><label>Next action<textarea onchange="patch('${t.id}','nextAction',this.value)">${esc(t.nextAction)}</textarea></label></div></div>`}
const baseCard=card;
card=function(t){return baseCard(t).replace(`<span class="actual">Actual ${dur(total(t))}</span>`,`<label>Actual <input class="actual-input" aria-label="Actual minutes" type="number" min="0" step="1" value="${Math.round(total(t)/60)}" onchange="changeActual('${t.id}',+this.value)"> min</label>`).replace('<label>Urgency <b>','<label title="Urgency">U <b>').replace('<label>Importance <b>','<label title="Importance">I <b>')};
function shortDate(value){if(!value)return '+ date';return new Date(value+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}
function priorityControl(t,field,label,abbr){let value=field==='urgency'?urgency(t):t.importance,disabled=field==='urgency'&&t.dueDate,handler=field==='urgency'?'changeUrgency':'changeImportance';return `<div class="priority-control" aria-label="${label}"><span title="${label}">${abbr}</span><span class="segments">${[1,2,3,4].map(v=>`<button type="button" class="${v<=value?'on':''}" title="${label} ${v}" aria-label="${label} ${v}" ${disabled?'disabled':''} onclick="${handler}('${t.id}',${v})"></button>`).join('')}</span><b>${value}</b></div>`}
function compactCard(t){let r=running&&running.id===t.id,status=t.status||'active',statusLabel=status==='active'?'Ready':status==='waiting'?'Waiting':'Blocked',distance=t.dueDate?dayNumber(t.dueDate)-dayNumber(today()):null,dateClass=distance<0?'overdue':distance===0?'today':'';return `<div class="card ${r?'running':''} ${t.completed?'completed':''} ${status} ${t.recommendationTier?`tier-${t.recommendationTier}`:'' }" data-task-id="${t.id}" draggable="true" ondragstart="dragged='${t.id}'"><div class="top"><button class="complete" onclick="completeTask('${t.id}')">${t.completed?'&#8634;':'&#10003;'}</button><textarea rows="1" class="task-title" aria-label="Task name" oninput="renameTask('${t.id}',this.value)">${esc(t.title)}</textarea><button class="status-button ${status}" title="Status: ${statusLabel}. Click to change." onclick="cycleStatus('${t.id}')">${statusLabel}</button></div><div class="priority-strip">${priorityControl(t,'urgency','Urgency','U')}${priorityControl(t,'importance','Importance','I')}</div><div class="compact-meta"><label class="date-chip ${dateClass}" title="Due date: ${esc(t.dueDate||'not set')}"><span>${shortDate(t.dueDate)}</span><input aria-label="Due date" type="date" value="${t.dueDate||''}" onchange="changeDate('${t.id}',this.value)"></label><label class="weekly-chip ${t.recurrence==='weekly'?'active':''}" title="Repeat weekly"><input aria-label="Repeat weekly" type="checkbox" ${t.recurrence==='weekly'?'checked':''} onchange="toggleWeekly('${t.id}',this.checked)"><span>&#8635;</span></label><label class="metric" title="Estimated minutes"><span>Est</span><input aria-label="Estimated minutes" type="number" min="0" value="${t.estimateMinutes}" onchange="changeEstimate('${t.id}',+this.value)"><small>m</small></label><label class="metric" title="Actual minutes"><span>Act</span><input class="actual-input" aria-label="Actual minutes" type="number" min="0" step="1" value="${Math.round(total(t)/60)}" onchange="changeActual('${t.id}',+this.value)"><small>m</small></label><button class="timer ${r?'pause':''}" onclick="toggleTimer('${t.id}')">${r?'Pause':'&#9654;'}</button></div><div class="more" ${showNotes?'':'hidden'}><label>Tags<input value="${esc(t.tags.join(', '))}" onchange="patch('${t.id}','tags',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></label><label>Next action<textarea onchange="patch('${t.id}','nextAction',this.value)">${esc(t.nextAction)}</textarea></label></div></div>`}
card=compactCard;
function finalCard(t){let r=running&&running.id===t.id,from=`<button class="timer ${r?'pause':''}" onclick="toggleTimer('${t.id}')">${r?'Pause':'&#9654;'}</button>`,label=r?'Pause timer':'Start timer',to=`<button class="timer ${r?'pause':''}" aria-label="${label}" title="${label}" onclick="toggleTimer('${t.id}')">${r?'&#9208;':'&#9654;'}</button>`;return compactCard(t).replaceAll('<small>m</small>','').replace(from,to)}
card=finalCard;
function patch(id,key,value){task(id)[key]=value;save();render()}
function cycleStatus(id){let t=task(id),previous=t.status||'active',next={active:'waiting',waiting:'blocked',blocked:'active'}[previous],events=[];if(running&&running.id===id){let paused=pauseRunning();if(paused)events.push(paused)}t.status=next;events.push(event('status_changed',t,{previousStatus:previous,newStatus:next}));save(events);render()}
function changeUrgency(id,value){let t=task(id);if(t.dueDate)return;let previous=t.urgency;t.urgency=value;save([event('priority_changed',t,{field:'urgency',previousValue:previous,newValue:value})]);render()}
function changeImportance(id,value){let t=task(id),previous=t.importance;t.importance=value;save([event('priority_changed',t,{field:'importance',previousValue:previous,newValue:value})]);render()}
function changeEstimate(id,value){let t=task(id),previous=t.estimateMinutes;t.estimateMinutes=value;save([event('estimate_changed',t,{previousMinutes:previous,newMinutes:value})]);render()}
function changeActual(id,value){let t=task(id),previous=total(t),minutes=Math.max(0,Number.isFinite(value)?value:0),wasRunning=running&&running.id===id,at=Date.now();t.actualSeconds=Math.round(minutes*60);if(wasRunning){running.since=at;t.runningSince=new Date(at).toISOString()}save([event('actual_time_corrected',t,{previousSeconds:previous,newSeconds:t.actualSeconds,timerWasRunning:!!wasRunning})]);render()}
function changeDate(id,value){let t=task(id),previous=t.dueDate||null,scope='this_occurrence';t.dueDate=value||null;if(value){t.urgency=dateUrgency(value);t.urgencyMode='automatic';if(t.recurrence==='weekly'){let weekday=new Date(value+'T12:00:00Z').getUTCDay();if(t.seriesWeekday==null||(previous&&weekday!==t.seriesWeekday&&confirm('Apply this weekday to future weekly occurrences?\nOK = this and future; Cancel = this occurrence only.'))){t.seriesWeekday=weekday;scope='this_and_future'}}}else{delete t.urgencyMode;delete t.recurrence;delete t.seriesWeekday}save([event('due_date_changed',t,{previousDate:previous,newDate:t.dueDate,scope})]);render()}
function toggleWeekly(id,checked){let t=task(id);if(checked&&!t.dueDate){alert('Choose a due date before making this task weekly.');render();return}let previous=t.recurrence||null;if(checked){t.recurrence='weekly';t.seriesId=t.seriesId||'series-'+t.id;t.seriesWeekday=new Date(t.dueDate+'T12:00:00Z').getUTCDay();t.occurrence=t.occurrence||1}else{delete t.recurrence;delete t.seriesWeekday}save([event('recurrence_changed',t,{previousRecurrence:previous,newRecurrence:t.recurrence||null})]);render()}
function nextWeeklyDate(from,weekday){let d=new Date(from+'T12:00:00Z'),delta=(weekday-d.getUTCDay()+7)%7||7;d.setUTCDate(d.getUTCDate()+delta);return d.toISOString().slice(0,10)}
function pauseRunning(at=Date.now()){if(!running)return null;let t=task(running.id),seconds=Math.max(0,Math.floor((at-running.since)/1000));t.actualSeconds+=seconds;delete t.runningSince;running=null;return event('timer_paused',t,{sessionSeconds:seconds,totalActualSeconds:t.actualSeconds})}
function toggleTimer(id){let events=[],t=task(id),at=Date.now();if(running&&running.id===id){events.push(pauseRunning(at))}else{let paused=pauseRunning(at);if(paused)events.push(paused);running={id,since:at};t.runningSince=new Date(at).toISOString();events.push(event('timer_started',t,{actualSecondsBeforeStart:t.actualSeconds}))}save(events);render()}
function completeTask(id){let t=task(id),events=[];if(t.completed){t.completed=false;delete t.completedAt;events.push(event('task_reopened',t))}else{if(running&&running.id===id){let paused=pauseRunning();if(paused)events.push(paused)}t.completed=true;t.completedAt=new Date().toISOString();let completion=event('task_completed',t,{estimateMinutes:t.estimateMinutes,actualSeconds:t.actualSeconds,recurring:t.recurrence==='weekly'});if(t.recurrence==='weekly'&&t.dueDate){let next={...t,id:'t'+Date.now(),completed:false,actualSeconds:0,dueDate:nextWeeklyDate(t.dueDate,t.seriesWeekday),occurrence:(t.occurrence||1)+1,generatedFromTaskId:t.id};delete next.completedAt;delete next.runningSince;next.urgency=dateUrgency(next.dueDate);state.tasks.push(next);completion.nextTaskId=next.id;completion.nextDueDate=next.dueDate;events.push(completion,event('recurring_task_created',next,{previousTaskId:t.id,occurrence:next.occurrence}))}else events.push(completion)}save(events);render()}
function dropTask(categoryId){if(dragged){task(dragged).categoryId=categoryId;dragged=null;save();render()}}
function renameCat(id,value){state.categories.find(c=>c.id===id).name=value;save()}
function renameTask(id,value){task(id).title=value;save()}
function moveCat(id,direction){let i=state.categories.findIndex(c=>c.id===id),j=i+direction;if(j>=0&&j<state.categories.length){[state.categories[i],state.categories[j]]=[state.categories[j],state.categories[i]];save();render()}}
function deleteCategory(id){let c=state.categories.find(c=>c.id===id);if(!c)return;let assigned=state.tasks.filter(t=>t.categoryId===id);if(assigned.length){alert('Move all '+assigned.length+' task'+(assigned.length===1?'':'s')+' out of "'+c.name+'" before deleting it.');return}if(state.categories.length===1){alert('The board needs at least one category.');return}if(!confirm('Delete empty category "'+c.name+'"?'))return;state.categories=state.categories.filter(c=>c.id!==id);save([event('category_deleted',null,{categoryId:id,categoryName:c.name})],{deletedCategoryIds:[id]});render()}
function addCat(){let name=prompt('Category name');if(name){state.categories.push({id:'c'+Date.now(),name});save();render()}}
function newTask(categoryId){let title=prompt('Task title');if(title){let t={id:'t'+Date.now(),title,categoryId,urgency:2,importance:2,estimateMinutes:30,actualSeconds:0,tags:[],nextAction:'Define next action.'};state.tasks.push(t);save([event('task_added',t,{estimateMinutes:t.estimateMinutes,importance:t.importance,urgency:t.urgency})]);render()}}
setInterval(()=>{if(running){now=Date.now();tracked.textContent=dur(state.tasks.reduce((s,t)=>s+total(t),0));let actual=document.querySelector('[data-task-id="'+running.id+'"] .actual-input');if(actual&&document.activeElement!==actual)actual.value=Math.round(total(task(running.id))/60)}},1000);
boot();
</script>
